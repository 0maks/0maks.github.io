name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so past gigs drop off and new Flickr photos appear.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 22
        env:
          # Optional. Without it the build falls back to Flickr's public feed (latest ~20 photos).
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
